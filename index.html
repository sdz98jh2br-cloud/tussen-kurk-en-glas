<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f1ed">
<title>Tussen Kurk & Glas — Proefformulier</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tussen Kurk & Glas">
<style>
:root {
 --paper:#f1f1ed; --wine:#761515; --ink:#5f2927; --muted:#b98e89;
 --line:rgba(118,21,21,.20); --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--wine);font-family:Georgia,"Times New Roman",serif}
button,input,textarea{font:inherit}
.screen{display:none;min-height:100dvh}
.screen.active{display:flex}
#cover{align-items:center;justify-content:center;padding:32px 20px;text-align:center;cursor:pointer}
.cover-card{width:min(94vw,820px);padding:3vh 10px}
.cover-logo{display:block;width:min(92vw,780px);max-height:78vh;object-fit:contain;margin:0 auto;border-radius:2px}
.logo-art{font-size:clamp(70px,18vw,150px);line-height:.8;color:#6b2420;font-family:Georgia,serif}
.brand{font-size:clamp(35px,8vw,66px);font-style:italic;margin-top:26px}
.tap{margin-top:50px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#826b66;font-size:14px}
.topbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(241,241,237,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.topbar .title{font-weight:650;color:var(--wine)}
.btn{border:1px solid rgba(118,21,21,.28);background:#fff;color:var(--wine);border-radius:10px;padding:9px 12px;cursor:pointer}
.btn.primary{background:var(--wine);color:#fff;border-color:var(--wine)}
#form{flex-direction:column}
.sheet{width:min(94vw,780px);margin:0 auto;padding:28px 12px 80px}
h1{text-align:center;font-size:clamp(40px,8vw,66px);font-style:italic;font-weight:400;margin:5px 0 26px}
.table-wrap{overflow-x:auto;padding-bottom:4px}
table{width:100%;min-width:570px;border-collapse:collapse;font-size:clamp(17px,3.5vw,25px)}
th{font-weight:400;padding:8px 8px 12px;text-align:center}
td{padding:7px 8px;text-align:center}
td:first-child,th:first-child{width:70px;text-align:right;padding-right:14px}
.score{width:100%;min-width:78px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:center;color:var(--wine);padding:8px 4px;border-radius:0;outline:none}
.score:focus{border-bottom:2px solid var(--wine)}
.notes-title{font-size:27px;margin:50px 0 10px}
textarea{width:100%;min-height:210px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.28);padding:14px;color:var(--wine);outline:none;resize:vertical}
textarea:focus{border-color:var(--wine)}
#aroma{flex-direction:column;overflow:hidden}
.wheel-area{flex:1;display:grid;place-items:center;padding:12px;min-height:0}
.stage{width:min(94vw,78dvh,820px);height:min(94vw,78dvh,820px);touch-action:none;user-select:none;overflow:hidden}
#wheel{width:100%;height:100%;object-fit:contain;display:block;transform-origin:50% 50%;will-change:transform;-webkit-user-drag:none;cursor:grab}
#wheel.dragging{cursor:grabbing}
.hint{text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#77635e;font-size:13px;padding:0 16px 12px}
@media(max-width:600px){.sheet{padding-top:18px} h1{margin-bottom:15px} .notes-title{margin-top:34px}}
@media print{.topbar{display:none} .screen{display:none!important} #form.active{display:flex!important} .sheet{width:100%;padding:20px} body{background:#fff}}
</style>
</head>
<body>
<section id="cover" class="screen active" aria-label="Voorpagina">
 <div class="cover-card">
   <img class="cover-logo" src="logo.jpg" alt="Tussen Kurk &amp; Glas">
   <div class="tap">Tik om het proefformulier te openen</div>
 </div>
</section>

<section id="form" class="screen">
 <div class="topbar">
   <button class="btn" onclick="show('cover')">Voorpagina</button>
   <div class="title">Tussen Kurk &amp; Glas</div>
   <button class="btn primary" onclick="show('aroma')">Aromawiel</button>
 </div>
 <main class="sheet">
   <h1>Proefformulier</h1>
   <div class="table-wrap">
   <table>
    <thead><tr><th>Nr.</th><th>Geur</th><th>Smaak</th><th>Afdronk</th><th>Totaal</th></tr></thead>
    <tbody>
      <tr><td>I.</td><td><input class="score" inputmode="decimal" aria-label="I. Geur" data-key="1-Geur"></td><td><input class="score" inputmode="decimal" aria-label="I. Smaak" data-key="1-Smaak"></td><td><input class="score" inputmode="decimal" aria-label="I. Afdronk" data-key="1-Afdronk"></td><td><input class="score" inputmode="decimal" aria-label="I. Totaal" data-key="1-Totaal"></td></tr><tr><td>II.</td><td><input class="score" inputmode="decimal" aria-label="II. Geur" data-key="2-Geur"></td><td><input class="score" inputmode="decimal" aria-label="II. Smaak" data-key="2-Smaak"></td><td><input class="score" inputmode="decimal" aria-label="II. Afdronk" data-key="2-Afdronk"></td><td><input class="score" inputmode="decimal" aria-label="II. Totaal" data-key="2-Totaal"></td></tr><tr><td>III.</td><td><input class="score" inputmode="decimal" aria-label="III. Geur" data-key="3-Geur"></td><td><input class="score" inputmode="decimal" aria-label="III. Smaak" data-key="3-Smaak"></td><td><input class="score" inputmode="decimal" aria-label="III. Afdronk" data-key="3-Afdronk"></td><td><input class="score" inputmode="decimal" aria-label="III. Totaal" data-key="3-Totaal"></td></tr><tr><td>IV.</td><td><input class="score" inputmode="decimal" aria-label="IV. Geur" data-key="4-Geur"></td><td><input class="score" inputmode="decimal" aria-label="IV. Smaak" data-key="4-Smaak"></td><td><input class="score" inputmode="decimal" aria-label="IV. Afdronk" data-key="4-Afdronk"></td><td><input class="score" inputmode="decimal" aria-label="IV. Totaal" data-key="4-Totaal"></td></tr><tr><td>V.</td><td><input class="score" inputmode="decimal" aria-label="V. Geur" data-key="5-Geur"></td><td><input class="score" inputmode="decimal" aria-label="V. Smaak" data-key="5-Smaak"></td><td><input class="score" inputmode="decimal" aria-label="V. Afdronk" data-key="5-Afdronk"></td><td><input class="score" inputmode="decimal" aria-label="V. Totaal" data-key="5-Totaal"></td></tr><tr><td>VI.</td><td><input class="score" inputmode="decimal" aria-label="VI. Geur" data-key="6-Geur"></td><td><input class="score" inputmode="decimal" aria-label="VI. Smaak" data-key="6-Smaak"></td><td><input class="score" inputmode="decimal" aria-label="VI. Afdronk" data-key="6-Afdronk"></td><td><input class="score" inputmode="decimal" aria-label="VI. Totaal" data-key="6-Totaal"></td></tr><tr><td>VII.</td><td><input class="score" inputmode="decimal" aria-label="VII. Geur" data-key="7-Geur"></td><td><input class="score" inputmode="decimal" aria-label="VII. Smaak" data-key="7-Smaak"></td><td><input class="score" inputmode="decimal" aria-label="VII. Afdronk" data-key="7-Afdronk"></td><td><input class="score" inputmode="decimal" aria-label="VII. Totaal" data-key="7-Totaal"></td></tr><tr><td>VIII.</td><td><input class="score" inputmode="decimal" aria-label="VIII. Geur" data-key="8-Geur"></td><td><input class="score" inputmode="decimal" aria-label="VIII. Smaak" data-key="8-Smaak"></td><td><input class="score" inputmode="decimal" aria-label="VIII. Afdronk" data-key="8-Afdronk"></td><td><input class="score" inputmode="decimal" aria-label="VIII. Totaal" data-key="8-Totaal"></td></tr><tr><td>IX.</td><td><input class="score" inputmode="decimal" aria-label="IX. Geur" data-key="9-Geur"></td><td><input class="score" inputmode="decimal" aria-label="IX. Smaak" data-key="9-Smaak"></td><td><input class="score" inputmode="decimal" aria-label="IX. Afdronk" data-key="9-Afdronk"></td><td><input class="score" inputmode="decimal" aria-label="IX. Totaal" data-key="9-Totaal"></td></tr>
    </tbody>
   </table>
   </div>
   <div class="notes-title">Aantekeningen</div>
   <textarea id="notes" placeholder=""></textarea>
 </main>
</section>

<section id="aroma" class="screen">
 <div class="topbar">
   <button class="btn" onclick="show('form')">← Proefformulier</button>
   <div class="title">Aromawiel</div>
   <button class="btn" id="reset">Beginstand</button>
 </div>
 <div class="wheel-area">
  <div class="stage" id="stage">
   <img id="wheel" draggable="false" src="aromawiel.png" alt="Aromawiel van Tussen Kurk & Glas">
  </div>
 </div>
 <div class="hint">Draai met één vinger. Knijp met twee vingers om in en uit te zoomen; versleep met twee vingers terwijl je bent ingezoomd.</div>
</section>

<script>
const screens=[...document.querySelectorAll('.screen')];
function show(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));window.scrollTo(0,0)}
document.getElementById('cover').addEventListener('click',()=>show('form'));

document.querySelectorAll('.score').forEach(el=>{
 const k='tkg-'+el.dataset.key; el.value=localStorage.getItem(k)||'';
 el.addEventListener('input',()=>localStorage.setItem(k,el.value));
});
const notes=document.getElementById('notes'), nk='tkg-notes';
notes.value=localStorage.getItem(nk)||'';
notes.addEventListener('input',()=>localStorage.setItem(nk,notes.value));

const stage=document.getElementById('stage'), wheel=document.getElementById('wheel');
let rotation=0, scale=1, panX=0, panY=0;
let startAngle=0, startRotation=0;
let startDistance=0, startScale=1;
let startMidX=0, startMidY=0, startPanX=0, startPanY=0;
let mouseDown=false;

function applyTransform(){
  wheel.style.transform='translate('+panX+'px,'+panY+'px) rotate('+rotation+'deg) scale('+scale+')';
}
function stageCenter(){
  const r=stage.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2};
}
function angleAt(x,y){
  const c=stageCenter();
  return Math.atan2(y-c.y,x-c.x)*180/Math.PI;
}
function touchDistance(a,b){
  const dx=b.clientX-a.clientX, dy=b.clientY-a.clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
function touchMidpoint(a,b){
  return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};
}
function clampPan(){
  if(scale<=1.001){panX=0;panY=0;return;}
  const r=stage.getBoundingClientRect();
  const maxX=(r.width*(scale-1))/2;
  const maxY=(r.height*(scale-1))/2;
  panX=Math.max(-maxX,Math.min(maxX,panX));
  panY=Math.max(-maxY,Math.min(maxY,panY));
}

/* iPhone/iPad: native touch events, avoiding Pointer Capture. */
stage.addEventListener('touchstart',function(e){
  wheel.classList.add('dragging');
  if(e.touches.length===1){
    startAngle=angleAt(e.touches[0].clientX,e.touches[0].clientY);
    startRotation=rotation;
  }else if(e.touches.length>=2){
    const a=e.touches[0], b=e.touches[1], mid=touchMidpoint(a,b);
    startDistance=touchDistance(a,b);
    startScale=scale;
    startMidX=mid.x; startMidY=mid.y;
    startPanX=panX; startPanY=panY;
  }
  e.preventDefault();
},{passive:false});

stage.addEventListener('touchmove',function(e){
  if(e.touches.length===1){
    const t=e.touches[0];
    rotation=startRotation+angleAt(t.clientX,t.clientY)-startAngle;
  }else if(e.touches.length>=2){
    const a=e.touches[0], b=e.touches[1], mid=touchMidpoint(a,b);
    const d=touchDistance(a,b);

    if(startDistance>0){
      const newScale=Math.max(1,Math.min(4,startScale*(d/startDistance)));

      // Houd het punt onder het midden van de twee vingers op dezelfde plek.
      // Daardoor zoom je in op waar je vingers staan, niet altijd op het midden.
      const c=stageCenter();
      const focusX=startMidX-c.x;
      const focusY=startMidY-c.y;
      const ratio=newScale/startScale;

      panX=focusX-(focusX-startPanX)*ratio+(mid.x-startMidX);
      panY=focusY-(focusY-startPanY)*ratio+(mid.y-startMidY);
      scale=newScale;
    }else{
      panX=startPanX+(mid.x-startMidX);
      panY=startPanY+(mid.y-startMidY);
    }

    clampPan();
  }
  applyTransform();
  e.preventDefault();
},{passive:false});

stage.addEventListener('touchend',function(e){
  if(e.touches.length===1){
    const t=e.touches[0];
    startAngle=angleAt(t.clientX,t.clientY);
    startRotation=rotation;
  }else if(e.touches.length===0){
    wheel.classList.remove('dragging');
  }
  e.preventDefault();
},{passive:false});
stage.addEventListener('touchcancel',function(){wheel.classList.remove('dragging');},{passive:true});

/* Desktop fallback: drag with the mouse to rotate. */
stage.addEventListener('mousedown',function(e){
  mouseDown=true; wheel.classList.add('dragging');
  startAngle=angleAt(e.clientX,e.clientY); startRotation=rotation;
  e.preventDefault();
});
window.addEventListener('mousemove',function(e){
  if(!mouseDown)return;
  rotation=startRotation+angleAt(e.clientX,e.clientY)-startAngle;
  applyTransform();
});
window.addEventListener('mouseup',function(){mouseDown=false;wheel.classList.remove('dragging');});

/* Desktop zoom with mouse wheel/trackpad. */
stage.addEventListener('wheel',function(e){
  const oldScale=scale;
  const newScale=Math.max(1,Math.min(4,scale*(e.deltaY<0?1.12:0.89)));

  if(newScale===1){
    scale=1; panX=0; panY=0;
  }else if(oldScale!==newScale){
    const c=stageCenter();
    const focusX=e.clientX-c.x;
    const focusY=e.clientY-c.y;
    const ratio=newScale/oldScale;
    panX=focusX-(focusX-panX)*ratio;
    panY=focusY-(focusY-panY)*ratio;
    scale=newScale;
    clampPan();
  }

  applyTransform();
  e.preventDefault();
},{passive:false});

document.getElementById('reset').addEventListener('click',function(){
  rotation=0; scale=1; panX=0; panY=0; applyTransform();
});
</script>
</body>
</html>
